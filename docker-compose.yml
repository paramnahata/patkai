services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: patkai
      POSTGRES_USER: patkai
      POSTGRES_PASSWORD: patkai
    ports: ["5432:5432"]
    volumes: ["patkai_pg:/var/lib/postgresql/data"]
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://patkai:patkai@postgres:5432/patkai
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  patkai_pg:
